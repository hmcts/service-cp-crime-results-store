# The estate starters and the read API's contract jar, and only those.
#
# Every other dependency stays inline in `build.gradle`, because dependabot does not read the
# `apply from:` files. Dependabot does read a version catalogue, and the sibling services keep the
# same pair here, so copying the coordinate keeps the repositories on the same versions.
[versions]
cp-auth-rules-filter = "1.0.7"
cp-audit-filter-springboot = "1.0.5"
# The read API's contract (hmcts/api-cp-crime-results-store; specs/003-read-api research R23): the
# team/rs draft rs-8fb8ea6 (api commit 8fb8ea6, the arrived-text operation and the payload form header
# withdrawn) while spec 005 is built; 0.3.0 once that commit is released. A release of this service needs
# a fixed X.Y.Z (./gradlew validateApiSpecVersions, run by ci-released.yml).
api-results-store = "rs-8fb8ea6"

[libraries]
cp-auth-rules-filter = { module = "uk.gov.hmcts.cp:cp-auth-rules-filter", version.ref = "cp-auth-rules-filter" }
cp-audit-filter-springboot = { module = "uk.gov.hmcts.cp:cp-audit-filter-springboot", version.ref = "cp-audit-filter-springboot" }
api-results-store = { module = "uk.gov.hmcts.cp:api-cp-crime-results-store", version.ref = "api-results-store" }
